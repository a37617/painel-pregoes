<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Radar de Pregões</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c1d1f;--muted:#6b6d72;--line:#e4e2dc;--accent:#1f5c4a;--accent-soft:#e3efe9;--warn:#a4521b;--warn-soft:#f8e9dd;--danger:#a8322d;--danger-soft:#f7e1df}
@media (prefers-color-scheme: dark){:root{--bg:#121413;--panel:#1b1e1d;--ink:#ecebe7;--muted:#9a9d9f;--line:#2c302e;--accent:#6cc3a3;--accent-soft:#1f322b;--warn:#e5a06c;--warn-soft:#3a2a1e;--danger:#ee8a84;--danger-soft:#3b2221}}
*{box-sizing:border-box}
body{margin:0;width:400px;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{font-size:15px;margin:0}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 10px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--panel);font-weight:600}
details{background:var(--panel);border-bottom:1px solid var(--line)}
summary{padding:9px 14px;cursor:pointer;color:var(--muted);font-size:12px}
.prefs{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 14px 12px}
.prefs label{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted)}
.prefs .full{grid-column:1/-1}
.prefs input,.prefs select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.prefs .chk{flex-direction:row;align-items:center;gap:6px}
.summary{padding:10px 14px;color:var(--muted);font-size:12px}
.summary b{color:var(--ink)}
ul{list-style:none;margin:0;padding:0 8px 8px;max-height:380px;overflow-y:auto}
li a{display:block;padding:8px 8px;border-radius:7px;color:inherit;text-decoration:none}
li a:hover{background:var(--accent-soft)}
.o{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:500}
.m{color:var(--muted);font-size:11.5px;margin-top:2px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--line);color:var(--muted)}
.badge.hot{background:var(--danger-soft);color:var(--danger)}
.badge.soon{background:var(--warn-soft);color:var(--warn)}
.badge.new{background:var(--accent);color:var(--panel)}
.empty{padding:24px 14px;text-align:center;color:var(--muted)}
footer{padding:10px 14px;border-top:1px solid var(--line);background:var(--panel);display:flex;justify-content:space-between;align-items:center;gap:8px}
footer small{color:var(--muted);font-size:11px}
</style>
</head>
<body>
<header>
  <h1>Radar de Pregões</h1>
  <a class="btn primary" id="painel" target="_blank" href="#">Abrir painel ↗</a>
</header>
<details id="cfg">
  <summary>⚙ Minhas palavras-chave e filtros</summary>
  <form class="prefs" id="prefs">
    <label class="full">Palavras no objeto (separe por vírgula)
      <input id="q" placeholder="ex.: notebook, impressora, toner">
    </label>
    <label>UF <select id="uf"><option value="">Brasil inteiro</option></select></label>
    <label>Valor mínimo (R$) <input id="vmin" type="number" min="0" step="1000" placeholder="0"></label>
    <label class="chk full"><input type="checkbox" id="notificar"> Me avisar quando surgir pregão novo</label>
    <button class="btn primary full" type="submit">Salvar</button>
  </form>
</details>
<div class="summary" id="summary">Carregando…</div>
<ul id="list"></ul>
<footer><small id="upd"></small><button class="btn" id="refresh" type="button">↻ Verificar agora</button></footer>
<script type="module" src="popup.js"></script>
</body>
</html>
